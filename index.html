<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data: https:; frame-src https:; webview-src https:;"
    />
    <title>Bustabit Monitor</title>
  </head>
  <body>
    <main id="app">
      <header>
        <div>
          <h1>Bustabit Monitor</h1>
          <p>Completed games update in real time.</p>
        </div>
        <p id="status" class="status">Connecting...</p>
      </header>
      <section class="table-panel">
        <table>
          <thead>
            <tr>
              <th>Game ID</th>
              <th>Hash</th>
              <th>Bust</th>
              <th>Received</th>
            </tr>
          </thead>
          <tbody id="games">
            <tr id="empty-row">
              <td colspan="4">Waiting for the next completed game...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <webview id="game-webview" webpreferences="contextIsolation=yes"></webview>
    <script type="module" src="/src/renderer.ts"></script>
  </body>
</html>
